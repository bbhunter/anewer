name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo version $version"
            exit 1
          }

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --generate-notes \
              --draft \
              --title "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: anewer-linux-x86_64-gnu.tar.gz
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: anewer-linux-x86_64-musl.tar.gz
            musl: true
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: anewer-linux-aarch64-gnu.tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: anewer-linux-aarch64-musl.tar.gz
            musl: true
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: anewer-macos-aarch64.tar.gz
          - runner: macos-15
            target: x86_64-apple-darwin
            asset: anewer-macos-x86_64.tar.gz
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset: anewer-windows-x86_64.zip

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install MUSL toolchain
        if: matrix.musl
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build release binary
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Verify static Linux binary
        if: matrix.musl
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/anewer"
          file "$binary"
          ! readelf -l "$binary" | grep -q INTERP
          ! readelf -d "$binary" | grep -q NEEDED

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tar -C "target/${{ matrix.target }}/release" \
            -czf "${{ matrix.asset }}" \
            anewer
          if command -v sha256sum >/dev/null; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $asset = "${{ matrix.asset }}"
          Compress-Archive `
            -Path "target/${{ matrix.target }}/release/anewer.exe" `
            -DestinationPath $asset
          $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLower()
          "$hash  $asset" | Set-Content "$asset.sha256" -NoNewline

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "${{ github.ref_name }}"
          "${{ matrix.asset }}"
          "${{ matrix.asset }}.sha256"
          --clobber
          --repo "${{ github.repository }}"

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release edit "${{ github.ref_name }}"
          --draft=false
          --latest
          --repo "${{ github.repository }}"
